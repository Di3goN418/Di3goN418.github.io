<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Segoe UI", Arial, sans-serif;
            color: white;

            background:
                radial-gradient(circle at 20% 20%, #3b176b 0%, transparent 35%),
                radial-gradient(circle at 80% 80%, #102b68 0%, transparent 35%),
                #070711;

            overflow: hidden;
        }

        /* Brillos de fondo */
        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
        }

        body::before {
            background: #8b5cf6;
            top: -150px;
            left: -100px;
        }

        body::after {
            background: #2563eb;
            bottom: -150px;
            right: -100px;
        }

        .card {
            position: relative;
            width: min(700px, 90%);
            padding: 70px 60px;

            text-align: center;

            background: rgba(15, 15, 30, 0.72);
            border: 1px solid rgba(139, 92, 246, 0.35);
            border-radius: 24px;

            backdrop-filter: blur(15px);

            box-shadow:
                0 0 40px rgba(124, 58, 237, 0.15),
                inset 0 0 30px rgba(59, 130, 246, 0.04);

            animation: aparecer 1s ease-out;
        }

        /* Pequeña línea decorativa */
        .line {
            width: 70px;
            height: 4px;
            margin: 0 auto 30px;

            border-radius: 10px;

            background: linear-gradient(
                90deg,
                #3b82f6,
                #8b5cf6
            );

            box-shadow: 0 0 15px #6366f1;
        }

        .subtitle {
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #9ca3af;
            margin-bottom: 15px;
        }

        h1 {
            font-size: clamp(42px, 8vw, 76px);
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 25px;

            background: linear-gradient(
                90deg,
                #60a5fa,
                #a78bfa,
                #c084fc
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            text-shadow: 0 0 30px rgba(139, 92, 246, 0.2);
        }

        .description {
            max-width: 520px;
            margin: auto;

            font-size: 18px;
            line-height: 1.7;
            color: #cbd5e1;
        }

        /* Decoración */
        .corner {
            position: absolute;
            width: 18px;
            height: 18px;
            border-color: #6366f1;
            opacity: 0.8;
        }

        .top-left {
            top: 18px;
            left: 18px;
            border-top: 2px solid;
            border-left: 2px solid;
        }

        .top-right {
            top: 18px;
            right: 18px;
            border-top: 2px solid;
            border-right: 2px solid;
        }

        .bottom-left {
            bottom: 18px;
            left: 18px;
            border-bottom: 2px solid;
            border-left: 2px solid;
        }

        .bottom-right {
            bottom: 18px;
            right: 18px;
            border-bottom: 2px solid;
            border-right: 2px solid;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .card {
                padding: 50px 25px;
            }

            .description {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <!-- Decoración -->
        <span class="corner top-left"></span>
        <span class="corner top-right"></span>
        <span class="corner bottom-left"></span>
        <span class="corner bottom-right"></span>

        <div class="line"></div>

        <!-- Puedes cambiar estos textos -->
        <div class="subtitle">Presentación</div>

        <h1>ヂィエゴ</h1>

        <p class="description">
            TICs
        </p>

    </main>

</body>
</html>
